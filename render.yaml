# Render.com blueprint: New + -> Blueprint -> pick this repo
services:
  - type: web
    name: flying-bird-auth
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI          # Render asks you to paste it
        sync: false
      - key: MONGO_DB_NAME
        value: flying-bird
      - key: GAMES
        value: flying-bird
      - key: JWT_SECRET         # Render generates a random secret
        generateValue: true
      - key: ADMIN_PASSWORD     # Render asks you to type it
        sync: false
      - key: CORS_ORIGINS
        value: "*"
